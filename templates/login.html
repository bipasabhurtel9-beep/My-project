<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .login-box{
            width:350px;
            margin:auto;
            margin-top:120px;
            background:white;
            padding:30px;
            border-radius:10px;
        }

        h1{
            font-size:50px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
        }

    </style>

</head>

<body>

<div class="login-box">

<h1>Login</h1>

<form method="POST">

<label>Username</label>
<input type="text" name="username">

<label>Password</label>
<input type="password" name="password">

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
