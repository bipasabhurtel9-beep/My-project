<!DOCTYPE html>
<html>
<head>
<title>Sales Records</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
}

.container{
width:70%;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:15px;
}

th{
background:#eee;
}

.btn{
background:#007bff;
color:white;
padding:10px 15px;
border-radius:5px;
text-decoration:none;
float:right;
}

</style>

</head>

<body>

<div class="container">

<a href="/" class="btn">
Back to Dashboard
</a>

<h1>Sales Records</h1>

<table>

<tr>
<th>ID</th>
<th>Product Name</th>
<th>Quantity Sold</th>
<th>Sale Date</th>
</tr>

{% for sale in sales_records %}

<tr>

<td>{{ sale['id'] }}</td>
<td>{{ sale['product_name'] }}</td>
<td>{{ sale['quantity_sold'] }}</td>
<td>{{ sale['sale_date'] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
