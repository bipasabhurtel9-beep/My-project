{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1>Sales Records</h1>
    <a class="btn" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</div>

<table>
    <tr>
        <th>ID</th>
        <th>Product Name</th>
        <th>Quantity Sold</th>
        <th>Sale Date</th>
    </tr>

    {% for sale in sales_records %}
    <tr>
        <td>{{ sale.id }}</td>
        <td>{{ sale.product_name }}</td>
        <td>{{ sale.quantity_sold }}</td>
        <td>{{ sale.sale_date }}</td>
    </tr>
    {% else %}
    <tr>
        <td colspan="4">No sales records found</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
