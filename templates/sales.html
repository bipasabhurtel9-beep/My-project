<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Records</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .btn {
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .no-data {
            margin-top: 20px;
            color: red;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <h1>Sales Records</h1>
        <a href="{{ url_for('dashboard') }}" class="btn">Back to Dashboard</a>
    </div>

    {% if sales_records %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Quantity Sold</th>
                    <th>Sale Date</th>
                </tr>
            </thead>
            <tbody>
                {% for sale in sales_records %}
                <tr>
                    <td>{{ sale.id }}</td>
                    <td>{{ sale.product_name }}</td>
                    <td>{{ sale.quantity_sold }}</td>
                    <td>{{ sale.sale_date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="no-data">No sales recorded yet.</p>
    {% endif %}

</div>

</body>
</html>
